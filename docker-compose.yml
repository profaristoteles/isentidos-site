version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: isentidos-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-isentidos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-isentidos_secure_pass}
      POSTGRES_DB: ${DB_NAME:-isentidos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - isentidos-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isentidos-app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-isentidos}:${DB_PASSWORD:-isentidos_secure_pass}@db:5432/${DB_NAME:-isentidos}?schema=public
      JWT_SECRET: ${JWT_SECRET:-mude-este-segredo-em-producao-123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@isentidos.com.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin_secure_pass_123}
      FRONTEND_URL: ${FRONTEND_URL:-https://isentidos.com.br}
    depends_on:
      - db
    volumes:
      - uploads-data:/app/public/uploads
    networks:
      - isentidos-network
      - traefik_network
    labels:
      - "traefik.enable=true"
      # Configuração de rotas para o domínio principal e subdomínio www
      - "traefik.http.routers.isentidos-app.rule=Host(`isentidos.com.br`) || Host(`www.isentidos.com.br`)"
      - "traefik.http.routers.isentidos-app.entrypoints=websecure"
      - "traefik.http.routers.isentidos-app.tls.certresolver=letsencrypt"
      # Direcionamento do Traefik para a porta 4000 do container
      - "traefik.http.services.isentidos-app.loadbalancer.server.port=4000"

volumes:
  pgdata:
    driver: local
  uploads-data:
    driver: local

networks:
  isentidos-network:
    driver: bridge
  traefik_network:
    external: true
