services:
  postgres:
    image: postgres:16-alpine
    container_name: isentidos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: isentidos
      POSTGRES_USER: isentidos
      POSTGRES_PASSWORD: isentidos
    ports:
      - "5432:5432"
    volumes:
      - isentidos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isentidos -d isentidos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  isentidos_pg_data:
