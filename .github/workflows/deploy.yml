name: Deploy de Produção

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e publicação
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/profaristoteles/isentidos-site:latest
            ghcr.io/profaristoteles/isentidos-site:${{ github.sha }}

      - name: Acionar Portainer
        if: success()
        run: |
          curl --fail --silent --show-error \
            -X POST \
            "${{ secrets.PORTAINER_WEBHOOK_URL }}"
